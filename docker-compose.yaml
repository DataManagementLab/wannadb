version: '3.6'
services:
    wannadb:
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        command: ['flask', '--app', 'app', '--debug', 'run', '--host', '0.0.0.0', '--port', '8000']
        restart: always
        tty: true
        ports:
            - '8000:8000'
        env_file:
            - wannadb_web/.env/.dev
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - ./:/home/wannadb
        networks:
            - mynetwork

    migrate:
        build:
            context: .
            dockerfile: Dockerfile
            target: migrate
        command: ["python", "-m", "wannadb_web.postgres.migrate"]
        env_file:
            - wannadb_web/.env/.dev
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - mynetwork
        volumes:
            - ./:/home/wannadb:ro

    worker:
        build:
            context: .
            dockerfile: Dockerfile
            target: worker
        tty: true
        command: ['celery', '-A', 'celery_app', 'worker', '-l', 'info', '--concurrency=1', '-Q', 'celery']
        env_file:
            - wannadb_web/.env/.dev
        volumes:
            - ./:/home/wannadb
        networks:
            - mynetwork
        depends_on:
            migrate:
                condition: service_completed_successfully
            wannadb:
                condition: service_started
            redis:
                condition: service_healthy

    feedback-worker:
        build:
            context: .
            dockerfile: Dockerfile
            target: worker
        tty: true
        command: ['celery', '-A', 'celery_app', 'worker', '-l', 'info', '--concurrency=1', '--prefetch-multiplier=1', '-Q', 'feedback']
        env_file:
            - wannadb_web/.env/.dev
        volumes:
            - ./:/home/wannadb
        networks:
            - mynetwork
        depends_on:
            migrate:
                condition: service_completed_successfully
            wannadb:
                condition: service_started
            redis:
                condition: service_healthy

    flower:
        build:
            context: .
            dockerfile: Dockerfile
            target: flower
        tty: true
        command: ['celery', 'flower']
        env_file:
            - wannadb_web/.env/.dev
        networks:
            - mynetwork
        ports:
            - '127.0.0.1:5555:5555'
        depends_on:
            wannadb:
                condition: service_started
            redis:
                condition: service_healthy

    postgres:
        image: postgres:16
        container_name: postgres-container
        environment:
            POSTGRES_PASSWORD: 0
            POSTGRES_DB: userManagement
        networks:
            - mynetwork
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 3s
            retries: 12

    redis:
        image: redis:alpine
        container_name: redis-container
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli ping | grep -qx PONG']
            interval: 5s
            timeout: 3s
            retries: 12
        ports:
            - '127.0.0.1:6379:6379'
        networks:
            - mynetwork

networks:
    mynetwork:
        driver: bridge

volumes:
    pgdata:
